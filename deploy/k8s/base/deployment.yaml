apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-web
  labels:
    app.kubernetes.io/name: eshop-web
    app.kubernetes.io/part-of: eshop
spec:
  replicas: 2
  revisionHistoryLimit: 5          # keeps ReplicaSets for `kubectl rollout undo`
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eshop-web
        app.kubernetes.io/part-of: eshop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654            # "app" user from the .NET base image
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # soft: dev cluster may have a single node
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-web
      containers:
        - name: web
          image: eshop-web           # replaced by the pipeline (kustomize images) with <acr>/eshop-web:<buildId>-<sha>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eshop-web-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Startup: in-memory DB is seeded at boot; give it up to 2.5 min before liveness applies.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
# The pipeline runs `kustomize edit set image eshop-web=<acr>/eshop-web:<tag>`
# against this file at deploy time, so the immutable build tag is the only input.
images:
  - name: eshop-web
    newName: eshop-web
    newTag: local-dev
